# blkpvnthr.com — corporate site (static), on the same Oracle VM as
# os.blkpvnthr.com. Files live under /var/www/blkpvnthr.com/current, a symlink the
# deploy script flips atomically; nginx serves them directly. This is an isolated
# server block: explicit server_name only, no default_server, so it never
# captures os / plaid / queen or any other subdomain.
#
# TLS settings follow this box's certbot convention (the same include + dhparam
# used by os.blkpvnthr.com, plaid, and queen) so all vhosts share one TLS policy.
#
# ── Install (already performed for the first deploy; here for reference) ──────
#   1. DNS: blkpvnthr.com and www.blkpvnthr.com A → 150.136.62.159.
#   2. Cert:  sudo certbot certonly --webroot -w /var/www/blkpvnthr.com/current \
#               -d blkpvnthr.com -d www.blkpvnthr.com
#   3. Ship:  bash deploy/deploy.sh   (from the workstation)
#   4. Link:  sudo ln -sfn /etc/nginx/sites-available/blkpvnthr.com \
#               /etc/nginx/sites-enabled/blkpvnthr.com
#             sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS. Keeps the ACME path open for renewals. ─────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name blkpvnthr.com www.blkpvnthr.com;

    location /.well-known/acme-challenge/ {
        root /var/www/blkpvnthr.com/current;
    }

    location / {
        return 301 https://blkpvnthr.com$request_uri;
    }
}

# ── www → apex, so https://blkpvnthr.com/ is the single canonical host. ───────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.blkpvnthr.com;

    ssl_certificate     /etc/letsencrypt/live/blkpvnthr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blkpvnthr.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://blkpvnthr.com$request_uri;
}

# ── The site. ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blkpvnthr.com;

    root  /var/www/blkpvnthr.com/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/blkpvnthr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blkpvnthr.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers, applied to every response including 404s. Set ONLY at the
    # server level: an add_header inside a location drops inherited headers, so
    # the locations below use `expires` (which does not reset inheritance).
    # HSTS is scoped to this host only (NO includeSubDomains): sibling subdomains
    # such as lol.blkpvnthr.com have a DNS record but no HTTPS vhost, and
    # includeSubDomains would force browsers to require HTTPS across all of them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Custom 404 (matches the file shipped in site/). Multi-page static site —
    # no SPA fallback.
    error_page 404 /404.html;

    # Assets use stable, un-hashed filenames (styles.css, main.js), so they are
    # cached only moderately — a redeploy must reach returning visitors within
    # the hour. ETag/Last-Modified make revalidation after expiry a cheap 304.
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    # HTML is always revalidated so content changes appear on the next visit.
    location / {
        expires -1;
        try_files $uri $uri.html $uri/ =404;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/css application/javascript image/svg+xml application/json application/xml application/xml+rss text/plain;
}
