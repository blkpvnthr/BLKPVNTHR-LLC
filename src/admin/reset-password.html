<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Reset password · BLKPVNTHR LLC Admin</title>
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" />
    <link rel="stylesheet" href="/admin/assets/admin.css" />
    <script src="/admin/assets/env.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div class="auth-wrap">
      <main id="main" class="auth-card">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">B</span>
          <span class="brand-name">BLKPVNTHR LLC</span>
        </div>
        <h1>Reset password</h1>
        <p class="auth-sub">Enter your account email and we will send secure reset instructions.</p>
        <form id="reset-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" />
          </div>
          <button class="btn btn-primary" type="submit" disabled>Send reset link</button>
        </form>
        <p class="notice notice-info" style="margin-top: 18px">
          Secure account recovery is provisioned in Phase 1.
        </p>
        <p class="auth-foot"><a href="/admin/login">Back to sign in</a></p>
        <div id="status" class="status" aria-live="polite">
          <span class="dot"></span>
          <span>…</span>
        </div>
      </main>
    </div>
    <script src="/admin/assets/app.js" defer></script>
  </body>
</html>
