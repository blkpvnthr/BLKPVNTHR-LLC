<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Verify · BLKPVNTHR LLC Admin</title>
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/assets/admin.css" />
    <script src="/admin/assets/env.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div class="auth-wrap">
      <main id="main" class="auth-card">
        <div class="brand">
          <img src="/assets/blkpvnthr-mark.png" alt="" width="30" height="30" decoding="async" />
          <span class="brand-name">
            BLKPVNTHR
            <span class="brand-suffix">LLC</span>
          </span>
        </div>
        <h1 id="mfa-title">Two-factor verification</h1>
        <p class="auth-sub" id="mfa-sub">Enter the 6-digit code from your authenticator app.</p>
        <div id="mfa-qr" style="text-align: center; margin-bottom: 8px"></div>
        <form id="mfa-form" novalidate>
          <div class="field">
            <label for="code">Authentication code</label>
            <input
              id="code"
              name="code"
              inputmode="numeric"
              autocomplete="one-time-code"
              pattern="[0-9]*"
              maxlength="6"
              required
            />
          </div>
          <button id="mfa-submit" class="btn btn-primary" type="submit" disabled>Verify</button>
          <p id="mfa-notice" class="notice notice-info" hidden></p>
        </form>
        <p class="auth-foot"><a href="/admin/login">Back to sign in</a></p>
        <div id="status" class="status" aria-live="polite">
          <span class="dot"></span>
          <span>…</span>
        </div>
      </main>
    </div>
    <script src="/admin/assets/app.js" defer></script>
  </body>
</html>
