  rel="stylesheet"
/>

<script>
  /* Hide-then-reveal is gated on this class. If main.js never arrives, the
         timeout drops the gate so content can never be stranded at opacity 0. */
  document.documentElement.classList.add('js');
  window.__revealFallback = setTimeout(function () {
    document.documentElement.classList.remove('js');
  }, 3000);
</script>
